; Philly Transit Display - PlatformIO project. See ../DESIGN.md sections 3 and 5.
; ESP32 board environments are added by the firmware skeleton work; keep [env:native] intact,
; it is what `pio test -e native` uses for the transit_core and transit_stats host tests.

[platformio]
default_envs = cyd-3248S035R
test_dir = test

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -DNATIVE_TEST
lib_deps = bblanchon/ArduinoJson@^7.4
lib_compat_mode = off

; =============================================================================
; ESP32 "Cheap Yellow Display" (Sunton) environments - DESIGN.md SS3, SS5.
;
; Versions below were checked against upstream sources on 2026-09-13 (release
; pages, library.json/registry metadata, PlatformIO's package registry via
; `pio pkg search`) rather than assumed from memory; see docs/hardware.md and
; firmware/boards/README.md for the supporting notes.
;
; Platform: pioarduino's platform-espressif32 fork/rebuild is the current way
; to get Arduino-ESP32 core 3.x under PlatformIO (the official PlatformIO
; registry's "espressif32" platform - platformio/espressif32@7.1.3 as of
; 2026-09-13 - still bundles the legacy Arduino-ESP32 2.x / toolchain-
; xtensa-esp32@8.4.0 line; confirmed by inspecting its platform.json).
;
; NOT pinned to pioarduino's `releases/download/stable/...zip` rolling
; alias, even though the task brief and pioarduino's own docs point at it as
; "the current way": `stable` currently resolves to release 55.03.311
; (Arduino core 3.3.11 on ESP-IDF v5.5.5), and esp32_smartdisplay 2.1.1 does
; not build against that - `esp_lcd_panel_t` doesn't have the separate
; `disp_off`/`disp_on` function-pointer fields smartdisplay's panel drivers
; assign into (`esp_panel_st7796.c`, `esp_panel_ili9341.c`, and 3 more all
; hit this; only `disp_on_off(panel, bool on_off)` exists). This is a
; confirmed, currently open upstream bug - rzeldent/esp32-smartdisplay#295
; ("'esp_lcd_panel_t' has no member named 'disp_off'"), reported
; 2025-12-21, still open. It is NOT cosmetic: the library's own panel-init
; code (lvgl_panel_st7796_spi.c etc.) calls esp_lcd_panel_disp_on_off(),
; which reads that exact field, so even if this somehow compiled unfixed it
; would call a null function pointer at boot.
;
; The maintainer's own reply on #295 suggested stepping back to an
; ESP-IDF-5.4-based core - tried that too (pioarduino tag `54.03.21-2`,
; Arduino v3.2.1 / ESP-IDF v5.4.2): same failure, so this bug isn't new in
; 5.5, esp32_smartdisplay 2.1.1 (and its unreleased `main`, also checked)
; has never actually built clean against any Arduino-ESP32 3.x. Their own
; CI stays green only because their project's platformio.ini uses the
; *unpinned* official `platformio/espressif32` platform, which (checked
; its platform.json) still bundles the legacy Arduino-ESP32 2.x /
; toolchain-xtensa-esp32@8.4.0 line - not core 3.x at all.
;
; Fix used here: `54.03.21-2` (Arduino v3.2.1 / ESP-IDF v5.4.2) is kept as
; the pin - it's still core 3.x per the task/DESIGN.md requirement, and
; there's no ESP-IDF-5.4-vs-5.5 reason to prefer one over the other now
; that neither builds smartdisplay unpatched - plus
; firmware/extra_scripts/patch_esp32_smartdisplay.py (wired in below via
; extra_scripts), which rewrites the ~5 affected files' `disp_off`
; assignment into a small `disp_on_off` shim after PlatformIO downloads the
; library, and separately fixes an unrelated `uint`-vs-`uint32_t` compile
; error in the same library (already fixed on their unreleased `main`, not
; in the 2.1.1 tag). See that script's own docstring for exactly what it
; rewrites and why, and for an important caveat: being a `pre:` script, it
; runs *before* PlatformIO resolves/downloads lib_deps, so a brand new
; environment's very first build has nothing to patch yet and will fail
; with the disp_off/uint errors again - re-running the identical `pio run
; -e <env>` a second time succeeds, because the library is on disk by then.
; This project's own build report ran into and confirmed exactly that.
; Revisit both this pin and the patch script once esp32-smartdisplay#295 is
; fixed upstream and a new version is tagged.
;
; Board JSONs: vendored from rzeldent/platformio-espressif32-sunton into
; firmware/boards/ (boards_dir below) rather than the upstream README's
; git-submodule approach, per this project's no-submodules policy. See
; firmware/boards/README.md for the exact commit and download date.
;
; Display/touch stack: rzeldent/esp32_smartdisplay 2.1.1 (LVGL 9.2.2 driver
; for every Sunton board from one codebase). `lvgl/lvgl@^9.2.2` actually
; resolves to 9.5.0 (the newest 9.x on the registry as of 2026-09-13) since
; PlatformIO's `^` is a caret range, not an exact pin - matches the task's
; "9.x compatible with smartdisplay" brief; built clean against 9.5.0.
; lv_conf.h lives at firmware/include/lv_conf.h; LV_CONF_PATH below points
; PlatformIO/LVGL at it (must be an absolute path - see smartdisplay's
; README "More on lv_conf.h"). Only the Montserrat sizes DESIGN.md SS8's UI
; actually uses (14/20/28 - trimmed from 14/16/20/28 in the flash diet, see
; firmware/README.md "Memory and flash budget") are enabled in lv_conf.h to save flash.
;
; BUILD BUG FOUND & FIXED HERE: esp32_smartdisplay's own README ("Step 6")
; shows this flag as `'-D LV_CONF_PATH=${platformio.include_dir}/lv_conf.h'`
; - no embedded quotes around the path. That produces
; `-DLV_CONF_PATH=/abs/path/lv_conf.h` with no quotes, and LVGL's
; `#include LV_CONF_PATH` then fails to compile ("#include expects
; \"FILENAME\" or <FILENAME>") because an unquoted path isn't valid
; `#include` syntax - confirmed by actually building cyd-3248S035R. Their
; own library's CI `platformio.ini` (not the README prose) uses
; `'-D LV_CONF_PATH="${platformio.test_dir}/lv_conf.h"'` - WITH the embedded
; double quotes - and that's the form used below. Treat the README's Step 6
; snippet as documentation with this one bug in it, not as ground truth.
;
; Wi-Fi/config/web: first-boot captive portal is our own (firmware/src/app/wifi_portal.*) on top
; of DNSServer (core) + ESPAsyncWebServer, not tzapu/WiFiManager - removed as the first item of
; the flash diet below: it was ~150KB+ of flash for a feature our own ~250-line module covers,
; and it was also the source of the `task_wdt: esp_task_wdt_reset(705): task not found` log spam
; on Arduino-ESP32 core 3.x (WiFiManager pokes the task watchdog from a task it doesn't own).
; The ESP32Async org's maintained ESPAsyncWebServer/AsyncTCP forks are kept (the me-no-dev/
; originals are unmaintained; ESP32Async is the community's continuation, confirmed via
; `pio pkg search` and both projects' own repos).
;
; Partition table: firmware/partitions.csv (custom - see that file's own
; header comment). Tried the two built-in schemes first, per the task
; brief: Arduino-ESP32's "default.csv" gives two 0x140000 (1.25 MiB) OTA
; app slots, which is smaller than this project's actual firmware.bin
; (~1.72 MiB - LVGL 9.5 + Wi-Fi/mbedTLS + ESPAsyncWebServer + WiFiManager +
; ArduinoJson add up fast even with every unused LVGL widget disabled, see
; firmware/include/lv_conf.h); "min_spiffs.csv" has big enough app slots
; (0x1E0000 = 1.875 MiB) but its 0x20000 (128 KB) data partition is under
; DESIGN.md SS3's 256 KB LittleFS minimum. Confirmed both by actually
; building cyd-3248S035R against each and hitting PlatformIO's
; `checkprogsize` failure, not by calculation alone.
;
; Deliberately NOT using esp32-smartdisplay's own suggested `-Ofast`: it
; enables fast-math, which isn't worth the risk to ArduinoJson float parsing
; or the epoch/time arithmetic used throughout transit_core for a firmware
; skeleton. PlatformIO's default release optimization (-Os) is used instead.
; =============================================================================
[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
framework = arduino
extra_scripts = pre:extra_scripts/patch_esp32_smartdisplay.py
boards_dir = boards
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; Flash diet (see firmware/README.md "Memory and flash budget"): level 2 (WARN) is enough
    ; to see real problems in the field without paying for every core-lib INFO/DEBUG string in
    ; flash. Bump to 5 (VERBOSE) locally when chasing a Wi-Fi/TLS/LVGL bug, never commit that:
    ;     -DCORE_DEBUG_LEVEL=5
    -DCORE_DEBUG_LEVEL=2
    '-D FIRMWARE_VERSION="0.1.0-skeleton"'
    '-D BOARD_NAME="${PIOENV}"'
    '-D LV_CONF_PATH="${platformio.include_dir}/lv_conf.h"'
    ; Add -DDEMO_DATA (uncomment below) to make GET /api/state and the LVGL main screen render
    ; demo_data.cpp's hardcoded Snapshot instead of the real one from net_poller - useful for
    ; screen/UI work with no Wi-Fi or SEPTA reachable. Off by default (real data is the point).
    ; -DDEMO_DATA
lib_deps =
    rzeldent/esp32_smartdisplay@^2.1.1
    lvgl/lvgl@^9.2.2
    esp32async/ESPAsyncWebServer@^3.12.1
    esp32async/AsyncTCP@^3.5.0
    bblanchon/ArduinoJson@^7.4

[env:cyd-3248S035R]
extends = esp32_base
board = esp32-3248S035R

[env:cyd-3248S035C]
extends = esp32_base
board = esp32-3248S035C

[env:cyd-2432S028R]
extends = esp32_base
board = esp32-2432S028R

[env:cyd-2432S028Rv3]
extends = esp32_base
board = esp32-2432S028Rv3

[env:cyd-2432S024R]
extends = esp32_base
board = esp32-2432S024R

[env:cyd-2432S024C]
extends = esp32_base
board = esp32-2432S024C
