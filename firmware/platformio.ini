; Philly Transit Display - PlatformIO project. See ../DESIGN.md sections 3 and 5.
; ESP32 board environments are added by the firmware skeleton work; keep [env:native] intact,
; it is what `pio test -e native` uses for the transit_core and transit_stats host tests.

[platformio]
default_envs = cyd-3248S035R
test_dir = test

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -DNATIVE_TEST
lib_deps = bblanchon/ArduinoJson@^7.4
lib_compat_mode = off
